<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DotiTimer Legal</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202f;
      --muted: #667085;
      --line: #e4e7ec;
      --brand: #0f766e;
      --bg: #fbfdfc;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.65;
    }
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 56px 20px 80px;
    }
    h1 {
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1.12;
      margin: 0 0 16px;
      letter-spacing: -0.04em;
    }
    p {
      color: var(--muted);
      margin: 0 0 28px;
      font-size: 17px;
    }
    a {
      color: var(--brand);
      font-weight: 700;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: white;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(15, 118, 110, 0.08);
    }
  </style>
</head>
<body>
  <main>
    <h1>DotiTimer Legal</h1>
    <p>DotiTimer의 개인정보처리방침과 법적 고지를 제공하는 공개 페이지입니다.</p>
    <section class="card">
      <h2>DotiTimer</h2>
      <p>DotiTimer는 루틴 타이머 앱입니다. 루틴 정보와 실행 기록은 기본적으로 사용자의 기기 안에 저장됩니다.</p>
      <a href="./dotitimer/privacy/">DotiTimer 개인정보처리방침 보기</a>
    </section>
  </main>
</body>
</html>
